name: Keep Streamlit app and Supabase awake

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" --max-redirs 5 "${APP_URL%/}/_stcore/health"

      # /_stcore/health はアプリ本体を実行しないため Supabase には通信が発生しない。
      # 無料プランは DB 無通信が続くとプロジェクトが自動 pause されるので、別途叩く。
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl -sS -o /dev/null -w "Supabase HTTP %{http_code}\n" --fail \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            "${SUPABASE_URL%/}/rest/v1/reservations?select=id&limit=1"
